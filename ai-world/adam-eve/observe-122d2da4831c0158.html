function row(parent,text){const el=document.createElement('div');el.className='logrow';el.textContent=text;parent.append(el);return el}
function inventory(items){
 const names={fruit:'野果',water:'飲水',wood:'木材',stone:'石材',seed:'種子',tool:'工具'};
 return Object.entries(items).filter(([,n])=>n>0).map(([k,n])=>(names[k]||k)+' ×'+n).join('、')||'無';
}
function historyText(h){return '第 '+(Math.floor(h.worldSecond/60)+1)+' 天 · #'+h.id+' '+(data.people[h.who]?.name||'世界')+' · '+(Array.isArray(h.result)?h.result.join('、'):(h.result.say?'「'+h.result.say+'」 ':'')+(h.result.ok?'':'受阻 · ')+h.result.message)}
function eventRow(parent,h){
 const article=document.createElement('article');article.className='event';
 const meta=document.createElement('small');meta.textContent='河谷 · 第 '+(1+Math.floor(h.worldSecond/60))+' 天 · #'+h.id;article.append(meta);
 const result=h.result,name=data.people[h.who]?.name||'世界';
 if(result.say){const line=document.createElement('p');line.textContent=name+'　'+result.say;article.append(line)}
 const narration=document.createElement('p');narration.className='narration';narration.textContent='旁白　'+name+' · '+(Array.isArray(result)?result.join('、'):(result.ok?'':'受阻 · ')+result.message);article.append(narration);parent.append(article)
}
function card(parent,title,summary,src){
 const tile=document.createElement('button');tile.className='tile';
 const face=document.createElement(src?'img':'span');if(src){face.src=src;face.alt=title}else{face.className='icon';face.textContent=title}
 const name=document.createElement('b'),body=document.createElement('small');name.textContent=title;body.textContent=summary;tile.append(face,name,body);
 tile.onclick=()=>{$('caption').textContent=title;$('description').textContent=summary;$('portrait').hidden=!src;if(src)$('portrait').src=src;$('preview').showModal()};parent.append(tile)
}
$('close').onclick=()=>$('preview').close();
function showHistory(){const query=$('search').value.trim();const found=data.history.filter(h=>(!$('filter').value||h.who===$('filter').value)&&historyText(h).includes(query));$('total').textContent=found.length+' 則紀錄';$('history').replaceChildren();for(const h of found.slice().reverse())eventRow($('history'),h)}
let cursor=null;
function replay(delta=0){const list=data.history;cursor=list.length?clamp((cursor??(list.length-1))+delta,0,list.length-1):null;$('prev').disabled=cursor===null||cursor===0;$('next').disabled=cursor===null||cursor===list.length-1;$('entry').textContent=cursor===null?'等待第一筆生活紀錄。':historyText(list[cursor])}
$('prev').onclick=()=>replay(-1);$('next').onclick=()=>replay(1);$('search').oninput=showHistory;
function wallClock(){$('wall').textContent='現實時間 · '+new Date().toLocaleTimeString('zh-TW',{hour12:false})}wallClock();setInterval(wallClock,1000);
function details(id){selected=id;const p=data.people[id];$('info').textContent=p.name+' · '+data.sites[p.site].label+' · 精力 '+p.energy+' · 飢餓 '+p.hunger+' · 口渴 '+p.thirst+' · 攜帶 '+inventory(p.bag)}
function render(){const s=data.state,sec=s.seconds,m=Math.floor((sec%60)*24);const day=Math.floor(sec/60);$('elapsed-days').textContent='第 '+(day+1)+' 天';$('clock').textContent='第 '+(1+Math.floor(day/360))+' 年 '+(1+Math.floor(day%360/30))+' 月 '+(1+day%30)+' 日　'+String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
$('state').textContent=statusNames[data.status]||data.status;$('count').textContent='AI 決策 '+s.decisions+' 次';$('updated').textContent='資料時間 '+new Date(data.updated).toLocaleString('zh-TW');$('reason').textContent=data.reason;$('toggle').hidden=!(local&&connected);$('toggle').disabled=['attention','stopped'].includes(data.status);$('toggle').textContent=data.status==='running'?'暫停':'開始';
$('people').replaceChildren();let ids=Object.keys(data.people);
for(const [i,id] of ids.entries()){const p=data.people[id],geo=data.sites[p.site];let b=document.getElementById('actor-'+id);
if(!b){b=document.createElement('button');b.id='actor-'+id;b.className='actor';const label=document.createElement('span');label.textContent=p.name;b.append(label);b.onclick=()=>{if(performance.now()-lastDrag>200)details(id)};$('plane').append(b);if(sprites[id])b.style.backgroundImage='url('+sprites[id]+')'}
const neighbors=ids.filter(k=>data.people[k].site===p.site);b.style.left=(geo.xy[0]+(neighbors.indexOf(id)-(neighbors.length-1)/2)*7)+'%';b.style.top=geo.xy[1]+'%';
card($('people'),p.name,(p.age<730?'嬰幼兒':p.age<4380?'兒童':p.age<6570?'青少年':'成年')+' · '+geo.label+'\n'+(p.goals.at(-1)?.[1]||'尚未登記個人目標')+(p.parents.length?'\n父母 '+p.parents.map(k=>data.people[k].name).join('、'):''),sprites[id]);
}
if(selected)details(selected);$('stock').replaceChildren();$('plane').querySelectorAll('.marker').forEach(e=>e.remove());
for(const [id,site] of Object.entries(s.sites)){const g=data.sites[id];let builds=Object.entries(site.buildings).map(([k,b])=>k+' '+b.stage+'/3');card($('stock'),g.label,inventory(site.stock)+(Object.keys(site.store).length?'\n倉儲 '+inventory(site.store):'')+(builds.length?'\n'+builds.join('、'):''));for(const [kind,building] of Object.entries(site.buildings))card($('stock'),kind,g.label+' · 施工 '+building.stage+'/3 · 耐久 '+building.condition);if(builds.length){const b=document.createElement('span');b.className='marker';b.textContent=builds.join('、');b.style.left=g.xy[0]+'%';b.style.top=(g.xy[1]+4)+'%';$('plane').append(b)}}
for(const n of s.needs)row($('stock'),'#'+n.id+' '+n.kind+' · '+n.status);
if(ids.length>2)row($('people'),'後續世代需要無近親關係的成年人；本世界未開放移民。');
for(const r of s.relations)row($('people'),data.people[r[0]].name+' → '+data.people[r[1]].name+' · '+r[2]+' '+(r[3]==='withdraw'?'撤回':'同意'));
for(const g of s.pregnancies)row($('people'),'懷孕 · 預產第 '+(g.due+1)+' 天');
$('log').replaceChildren();for(const h of data.history.slice(-5).reverse())eventRow($('log'),h);if(!data.history.length)row($('log'),'等待第一筆生活紀錄。');
$('highlights').replaceChildren();
for(const h of data.history.slice().reverse()){
 const messages=Array.isArray(h.result)?h.result:[h.result.ok?h.result.message:''];
 for(const message of messages.filter(m=>/施工|受孕|確認懷孕|產下|進入成年|收穫|修復|製成/.test(m))){
 const li=document.createElement('li');li.textContent='河谷 第 '+(1+Math.floor(h.worldSecond/60))+' 天 · '+message;$('highlights').append(li)
 }}
if(!$('highlights').childElementCount)$('highlights').textContent='尚無建築、收穫或成長紀錄。';
replay();const old=$('filter').value;$('filter').replaceChildren(new Option('所有紀錄',''));for(const id of ids)$('filter').add(new Option(data.people[id].name,id));$('filter').value=old;showHistory()}
$('filter').onchange=showHistory;$('save').onclick=()=>{try{localStorage.setItem('adam-eve-notes', $('note').value);$('feedback').textContent='已儲存'}catch{$('feedback').textContent='瀏覽器無法儲存，請複製標註'}};try{$('note').value=localStorage.getItem('adam-eve-notes')||''}catch{}
$('toggle').onclick=async()=>{try{const r=await fetch(data.status==='running'?'/pause':'/start',{method:'POST',headers:{'X-World':'eden'}});if(!r.ok)throw Error((await r.json()).error);await refresh()}catch(e){$('reason').textContent=e.message}};
async function refresh(){if(refreshing)return;refreshing=true;try{const r=await fetch(publicLive?relay+'/state':'/state',{cache:'no-store',signal:AbortSignal.timeout(3500)});if(!r.ok)throw Error();const current=await r.json();if(!current.people?.adam||!current.people?.eve||!Number.isFinite(current.state?.seconds))throw Error();if(publicLive && (current.world!=='adam-eve'||!Number.isFinite(Date.parse(current.updated))))throw Error();data=current;connected=true;render();
 const fresh=Date.now()-Date.parse(data.updated)<20000;
 $('connection').textContent=publicLive?(fresh?'公開觀察已連線':'直播中斷 · 最後快照'):'本機已連線';
 if(publicLive&&!fresh)$('state').textContent='等待更新'}catch{connected=false;$('connection').textContent='服務離線 · 最後快照';$('state').textContent='連線中斷';$('toggle').disabled=true}finally{refreshing=false}}
{
 const form=$('board-form'), status=$('board-status'), owner=$('board-owner');
 const pages=[null];
 let revision=0, notes=[], managing=false, sending=false;
 const make=(tag,text)=>{const node=document.createElement(tag);node.textContent=text;return node};
 const action=(label,fn)=>{const b=make('button',label);b.type='button';b.onclick=async()=>{
   b.disabled=true;try{await fn()}catch(e){status.textContent=e.message}finally{b.disabled=false}
 };return b};
 async function call(url, options={}) {
   let r;
   try {r=await fetch(url,{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer',signal:AbortSignal.timeout(10000),...options})}
   catch {throw Error('無法確認連線結果，請重新整理留言。')}
   const data=await r.json().catch(()=>({}));
   if(!r.ok){const wait=Number(r.headers.get('Retry-After'));throw Error((data.error||'留言服務暫時無法使用。')+(wait>0?' 請等 '+wait+' 秒。':''))}
   return data;
 }
 const admin=(op,data={})=>call('/board/admin/'+op,{method:'POST',headers:{'Content-Type':'application/json','X-World':'eden'},body:JSON.stringify(data)});
 function draw(){
   const list=$('threads');list.replaceChildren();
   for(const n of notes){
     const item=document.createElement('article');
     item.append(make('strong',n.name),make('small',new Date(n.created).toLocaleString('zh-TW')),make('p',n.body));
     if(n.reply)item.append(make('strong','Michael · 站主回覆'),make('p',n.reply));
     if(managing){
       const edit=make('details',''),summary=make('summary','回覆或管理這則留言'),reply=make('textarea','');
       reply.value=n.reply;reply.maxLength=1000;reply.setAttribute('aria-label','站主回覆');
       edit.append(summary,reply,action('儲存回覆',async()=>{await admin('reply',{id:n.id,reply:reply.value});await load()}),
         action('刪除留言',async()=>{if(confirm('刪除這則留言和站主回覆？')){await admin('delete',{id:n.id});await load()}}),
         action('刪除並封鎖來源',async()=>{if(confirm('刪除這則留言，並封鎖這個瀏覽器及網路來源？同網路的其他訪客也可能受影響。')){
           await admin('block',{id:n.id});await load();await bans()
         }}));
       item.append(edit);
     }list.append(item);
   }
 }
 async function bans(){
   const data=await admin('bans');
   $('board-bans').replaceChildren(...data.bans.map(b=>action('解除封鎖 · '+b.name,async()=>{
     await admin('unblock',{id:b.id});await bans();status.textContent='已解除封鎖。'
   })));
   $('board-owner-status').textContent='站主管理已啟用。封鎖來源 '+data.bans.length+' 筆。';
 }
 async function load(){
   const seq=++revision;
   if(!relay){status.textContent='公開留言服務尚未連接。';return}
   try {
     const cursor=pages.at(-1),data=await call(relay+'/board/comments'+(cursor?'?before='+cursor:''));
     if(seq!==revision)return;
     if(!Array.isArray(data.notes))throw Error('留言服務尚未準備好。');
     notes=data.notes;draw();form.querySelector('button').disabled=sending;
     $('board-back').hidden=pages.length===1;$('board-more').hidden=!data.more;
     status.textContent=notes.length?'第 '+pages.length+' 頁':'這一頁還沒有留言。';
   } catch(e){if(seq===revision){status.textContent=e.message;form.querySelector('button').disabled=true}}
 }
 owner.hidden=!local||!relay;
 owner.ontoggle=async()=>{if(!owner.open){managing=false;draw();return}
   try{await bans();managing=owner.open}catch(e){managing=false;$('board-owner-status').textContent=e.message}draw()
 };
 form.onsubmit=async e=>{
   e.preventDefault();if(sending||!relay)return;sending=true;form.querySelector('button').disabled=true;
   try {
     let visitor=localStorage.getItem('eden-board-visitor');
     if(!/^[a-f0-9]{64}$/.test(visitor)){visitor=Array.from(crypto.getRandomValues(new Uint8Array(32)),n=>n.toString(16).padStart(2,'0')).join('');localStorage.setItem('eden-board-visitor',visitor)}
     await call(relay+'/board/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...Object.fromEntries(new FormData(form)),visitor})});
     form.elements.body.value='';pages.splice(1);await load();status.textContent='留言已送出。';
   } catch(e){status.textContent=e.message}finally{sending=false;form.querySelector('button').disabled=false}
 };
 $('board-refresh').onclick=load;$('board-more').onclick=()=>{if(notes.length){pages.push(notes.at(-1).id);load()}};
 $('board-back').onclick=()=>{if(pages.length>1){pages.pop();load()}};
 if('IntersectionObserver' in window){const io=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)){io.disconnect();load()}});io.observe($('board'))}else load();
}
$('connection').textContent='離線快照';render();if(local||publicLive){refresh();setInterval(refresh,publicLive?5000:2000)}

{

   tracker.onload=()=>window.MALAnalytics?.flush();document.head.append(tracker);

 let previous;
 async function updateTraffic(){

     const response=await fetch('https://mm7382.github.io/ai-world/atlantis/visitor-stats.json',{cache:'no-store',credentials:'omit',signal:AbortSignal.timeout(6000)});
     if(!response.ok)throw Error();const v=await response.json();

     previous=v;

   output.title='全站匿名裝置估計，本機預覽不計入。更新於 '+new Date(previous.fetchedAt).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'});
 }
 updateTraffic();setInterval(()=>{if(!document.hidden)updateTraffic()},60000);
