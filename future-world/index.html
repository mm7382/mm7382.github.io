const copy={zh:{skip:'跳到主要內容',home:'← Michael Agent Lab · 返回首頁',label:'未來世界 · 概念預告',title:'回來以後',intro:'Michael 對未來世界的想像。\n選一個視角，走進同一天。',caption:'完整概念示意圖，圖內文字與按鈕為畫面設計。請使用下方視角按鈕查看體驗狀態。',experience:'從你的視角開始',status:'互動體驗準備中，目前開放概念預覽。',michael:'Michael 視角 →',lucy:'Lucy 視角 →',footer:'未來世界創作',back:'返回作品集 ↑',message:'旅程正在準備中。\n先留在這裡，看看未來的模樣。',close:'關閉',alt:'回來以後概念圖：玻璃空橋連接未來城市，下方呈現空橋、藝術房間與裝滿未來機器的工作室。'},en:{skip:'Skip to content',home:'← Michael Agent Lab · Home',label:'FUTURE WORLD · CONCEPT PREVIEW',title:'Upon Returning',intro:'Michael’s vision of a future world.\nTwo perspectives. One shared day.',caption:'A complete concept illustration. Text and buttons inside the image are part of the design. Use the perspective buttons below to check the experience status.',experience:'Choose your perspective',status:'The interactive experience is in preparation. Explore the concept for now.',michael:'Michael’s perspective →',lucy:'Lucy’s perspective →',footer:'A future world by Michael',back:'Back to portfolio ↑',message:'The journey is in preparation.\nFor now, take a glimpse of this future world.',close:'Close',alt:'Upon Returning concept: a glass skybridge through a future city, with previews of the skybridge, art room and a workshop filled with futuristic machines.'}};
let motionPaused=false;
function updateMotion(){const en=document.documentElement.lang==='en';const button=document.querySelector('.motion');button.textContent=motionPaused?(en?'Play ambient light':'播放光影動態'):(en?'Pause ambient light':'暫停光影動態');button.setAttribute('aria-pressed',String(motionPaused));document.body.classList.toggle('motion-paused',motionPaused)}
document.querySelector('.motion').addEventListener('click',()=>{motionPaused=!motionPaused;updateMotion()});
function render(){const lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'zh';const text=copy[lang];document.documentElement.lang=lang==='en'?'en':'zh-Hant';document.title=lang==='en'?'Upon Returning | Future World Preview · Michael':'回來以後｜未來世界預告 · Michael';document.querySelectorAll('[data-copy]').forEach(el=>{el.textContent=text[el.dataset.copy];el.style.whiteSpace='pre-line'});document.querySelectorAll('[data-lang]').forEach(el=>el.setAttribute('aria-current',String(el.dataset.lang===lang)));const img=document.querySelector('#concept');img.src='assets/concept-'+lang+'.webp';img.alt=text.alt;updateMotion()}
document.querySelectorAll('[data-lang]').forEach(link=>link.addEventListener('click',event=>{if(event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;event.preventDefault();history.pushState({},'',link.href);render()}));window.addEventListener('popstate',render);render();
const dialog=document.querySelector('dialog');let trigger;
dialog.addEventListener('keydown',event=>{if(event.key==='Tab'){event.preventDefault();dialog.querySelector('.close').focus()}});
document.querySelectorAll('[data-experience]').forEach(button=>button.addEventListener('click',()=>{if(dialog.open)return;trigger=button;dialog.showModal()}));document.querySelector('.close').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',event=>{const r=dialog.getBoundingClientRect();if(event.target===dialog&&(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom))dialog.close()});dialog.addEventListener('close',()=>trigger?.focus());
